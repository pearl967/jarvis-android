<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>J.A.R.V.I.S.</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #04070b; color: #9fe9ff;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(20,90,110,.28), transparent 58%),
      repeating-linear-gradient(0deg, rgba(80,190,220,.045) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(80,190,220,.045) 0 1px, transparent 1px 34px);
    pointer-events: none;
  }
  .wrap {
    position: relative; height: 100%; padding: 18px 16px 14px;
    display: flex; flex-direction: column;
  }
  header { text-align: center; letter-spacing: 3px; }
  header .title {
    font-size: 22px; font-weight: bold; color: #ffd88a;
    text-shadow: 0 0 14px rgba(255,200,100,.55);
  }
  header .sub { font-size: 9px; color: #5e9fb0; margin-top: 3px; letter-spacing: 2px; }

  .core {
    flex: 0 0 auto; height: 250px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(120,225,255,.35);
  }
  .r1 { width: 220px; height: 220px; border-style: dashed; animation: spin 26s linear infinite; }
  .r2 { width: 176px; height: 176px; border-color: rgba(255,208,120,.45); animation: spin 14s linear infinite reverse; }
  .r3 { width: 132px; height: 132px; border-color: rgba(120,225,255,.18); }
  .glow {
    position: absolute; width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,230,255,.35), transparent 70%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .center {
    position: relative; text-align: center; z-index: 2;
    font-size: 13px; letter-spacing: 2px; color: #d8f7ff;
    text-shadow: 0 0 10px rgba(120,225,255,.8);
  }
  .center small { display: block; font-size: 9px; color: #6fb6c8; margin-top: 6px; letter-spacing: 1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.25); opacity: .35; } }

  #status {
    text-align: center; font-size: 12px; color: #ffd88a;
    min-height: 18px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,200,100,.4);
  }
  #partial {
    text-align: center; font-size: 11px; color: #6fb6c8;
    min-height: 16px; margin-top: 4px;
  }

  .log {
    flex: 1 1 auto; overflow-y: auto; margin: 12px 0;
    padding: 10px; border: 1px solid rgba(120,225,255,.14);
    background: rgba(8,22,30,.55); font-size: 12px; line-height: 1.5;
  }
  .line { margin-bottom: 8px; }
  .who { color: #ffd88a; font-size: 10px; letter-spacing: 1px; }
  .say { color: #d8f7ff; }
  .ans { color: #9fe9ff; }
  .err { color: #ff8f8f; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button, .toggle {
    appearance: none; border: 1px solid rgba(255,208,120,.5);
    background: rgba(255,208,120,.07); color: #ffd88a;
    padding: 12px 6px; font-family: inherit; font-size: 12px;
    letter-spacing: 1px; text-align: center; cursor: pointer;
  }
  button:active, .toggle:active { background: rgba(255,208,120,.22); }
  .on { background: rgba(120,225,255,.18); border-color: #9fe9ff; color: #d8f7ff; }

  .entry { display: flex; margin-top: 8px; }
  .entry input {
    flex: 1; min-width: 0; background: rgba(8,22,30,.8);
    border: 1px solid rgba(120,225,255,.25); color: #d8f7ff;
    padding: 11px; font-family: inherit; font-size: 12px; outline: none;
  }
  .entry button { margin-left: 6px; padding: 11px 14px; }

  details { margin-top: 8px; font-size: 10px; color: #5e9fb0; }
  details input {
    width: 100%; margin-top: 6px; background: #07131a;
    border: 1px solid rgba(120,225,255,.2); color: #9fe9ff;
    padding: 7px; font-family: inherit; font-size: 10px;
  }
  details button { margin-top: 6px; padding: 7px; font-size: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">J.A.R.V.I.S.</div>
    <div class="sub">LOCAL SYSTEM // ONLINE</div>
  </header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="glow"></div>
    <div class="center">JARVIS<small id="mode">РЕЖИМ: ФРАЗА</small></div>
  </div>

  <div id="status">Инициализация...</div>
  <div id="partial"></div>

  <div class="log" id="log">
    <div class="line"><div class="who">JARVIS</div><div class="ans">К вашим услугам, сэр. Скажите «Джарвис» и задайте вопрос.</div></div>
  </div>

  <div class="controls">
    <button id="btnListen" onclick="JarvisBridge.listen()">СЛУШАТЬ</button>
    <button id="btnStop" onclick="JarvisBridge.stop()">СТОП</button>
    <button id="btnCont" class="toggle" onclick="toggleContinuous()">НЕПРЕРЫВНЫЙ</button>
    <button id="btnTest" onclick="JarvisBridge.test()">ПРОВЕРКА СВЯЗИ</button>
  </div>

  <div class="entry">
    <input id="text" placeholder="Введите команду..." onkeydown="if(event.keyCode===13)sendText()">
    <button onclick="sendText()">ОТПРАВИТЬ</button>
  </div>

  <details>
    <summary>НАСТРОЙКИ ЯДРА</summary>
    <input id="endpoint" placeholder="http://192.168.0.234:8001/v1/chat/completions">
    <button onclick="saveEndpoint()">СОХРАНИТЬ</button>
  </details>
</div>

<script>
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function addLog(who, text, cls) {
  var log = document.getElementById('log');
  var d = document.createElement('div');
  d.className = 'line';
  d.innerHTML = '<div class="who">' + who + '</div><div class="' + cls + '">' + esc(text) + '</div>';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
window.JarvisUI = {
  status: function(s) { document.getElementById('status').textContent = s; },
  partial: function(s) { document.getElementById('partial').textContent = s; },
  stream: function(s) {
    document.getElementById('partial').textContent = s;
    document.querySelector('.glow').style.opacity = '1';
  },
  heard: function(s) {
    document.getElementById('partial').textContent = '';
    addLog('ВЫ', s, 'say');
  },
  answer: function(s) {
    document.getElementById('partial').textContent = '';
    addLog('JARVIS', s, 'ans');
  },
  error: function(s) { addLog('СИСТЕМА', s, 'err'); }
};
function sendText() {
  var i = document.getElementById('text');
  var v = i.value.trim();
  if (!v) return;
  i.value = '';
  addLog('ВЫ', v, 'say');
  JarvisBridge.ask(v);
}
function toggleContinuous() {
  var b = document.getElementById('btnCont');
  var current = b.className.indexOf('on') >= 0;
  JarvisBridge.setContinuous(!current);
  b.className = !current ? 'toggle on' : 'toggle';
  document.getElementById('mode').textContent = !current ? 'РЕЖИМ: ПОСТОЯННЫЙ' : 'РЕЖИМ: ФРАЗА';
}
function saveEndpoint() {
  JarvisBridge.setEndpoint(document.getElementById('endpoint').value);
  JarvisUI.status('Адрес ядра обновлён');
}
setTimeout(function() {
  try {
    document.getElementById('endpoint').value = JarvisBridge.getEndpoint();
    if (JarvisBridge.isContinuous()) {
      document.getElementById('btnCont').className = 'toggle on';
      document.getElementById('mode').textContent = 'РЕЖИМ: ПОСТОЯННЫЙ';
    }
  } catch (e) {}
}, 400);
</script>
</body>
</html>
